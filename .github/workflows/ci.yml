name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moteur:
    name: Moteur (tests Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Critère de la tâche 3.4 : une diapositive de 15 433 px en moins de
      # 30 s. Mesure de temps, donc en compilation optimisée (D-3.4-e).
      - run: cargo test --release -p insitu-core --test deformation -- --nocapture

  interface:
    name: Interface (types, tests et construction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  coque:
    name: Coque Mac (compilation Tauri)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # La coque embarque l'interface construite : elle doit exister avant.
      - run: npm run build
      - run: cargo check -p insitu-app
