name: Fabrication de l'app Mac

# Produit InSitu.dmg pour Mac Apple Silicon.
# - Quand le numéro de version change sur `main` : fabrique l'app et publie
#   la version dans l'onglet « Releases » du dépôt. Il n'y a rien d'autre à
#   faire : pas d'étiquette à poser à la main.
# - Sur une demande de fusion qui touche à l'emballage de l'app (ce fichier,
#   tauri.conf.json, icônes) : fabrique l'app sans la publier. Le code de la
#   coque, lui, est vérifié par la compilation de ci.yml, bien moins chère
#   (D14). Une app qui ne démarre pas est attrapée au plus tard ici, avant
#   publication : la version n'est alors pas publiée.
# - À la main (bouton « Run workflow ») : fabrique sans publier.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fabrication.yml"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/icons/**"

permissions:
  contents: write

concurrency:
  group: fabrication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decider:
    name: Faut-il fabriquer ?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      fabriquer: ${{ steps.choix.outputs.fabriquer }}
      publier: ${{ steps.choix.outputs.publier }}
    steps:
      - uses: actions/checkout@v4
      - name: Lire le numéro de version
        id: version
        run: |
          VERSION=$(awk '/^\[workspace.package\]/{inside=1; next} /^\[/{inside=0} inside && /^version *=/{gsub(/[" ]/, "", $0); sub(/^version=/, "", $0); print; exit}' Cargo.toml)
          test -n "$VERSION"
          echo "Version du code : $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Décider
        id: choix
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "Fabrication d'essai, sans publication."
            echo "fabriquer=true" >> "$GITHUB_OUTPUT"
            echo "publier=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La version $VERSION est déjà publiée : rien à faire."
            echo "fabriquer=false" >> "$GITHUB_OUTPUT"
            echo "publier=false" >> "$GITHUB_OUTPUT"
          else
            echo "La version $VERSION n'est pas encore publiée : fabrication et publication."
            echo "fabriquer=true" >> "$GITHUB_OUTPUT"
            echo "publier=true" >> "$GITHUB_OUTPUT"
          fi

  app:
    name: InSitu.dmg (Apple Silicon)
    needs: decider
    if: needs.decider.outputs.fabriquer == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: fabrication

      - run: npm ci

      - name: Fabriquer l'app
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: Contrôler l'app fabriquée
        run: |
          BUNDLE=target/aarch64-apple-darwin/release/bundle
          APP="$BUNDLE/macos/InSitu.app"
          test -d "$APP"
          BIN=$(find "$APP/Contents/MacOS" -type f -perm +111 | head -n 1)
          echo "Exécutable : $BIN"
          test "$(lipo -archs "$BIN")" = "arm64"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist" \
            | grep -x "${{ needs.decider.outputs.version }}"

          # Les images de démonstration sont-elles embarquées ?
          test -f "$APP/Contents/Resources/jeu-essai/epinal/references/verres/verre-a.png"
          test -f "$APP/Contents/Resources/jeu-essai/epinal/references/photos-redressees/a.jpg"

          # L'app démarre-t-elle ? On la lance dix secondes : si elle s'est
          # arrêtée toute seule entre-temps, c'est qu'elle plante au lancement.
          "$BIN" &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::L'app s'est arrêtée toute seule dans les dix secondes suivant son lancement."
            exit 1
          fi
          kill "$PID"
          echo "L'app est restée ouverte dix secondes."

      - name: Nommer le fichier
        id: dmg
        run: |
          SOURCE=$(ls target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          DMG="InSitu-${{ needs.decider.outputs.version }}.dmg"
          cp "$SOURCE" "$DMG"
          hdiutil verify "$DMG"
          ls -lh "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: InSitu-${{ needs.decider.outputs.version }}
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 14

      - name: Publier la version
        if: needs.decider.outputs.publier == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decider.outputs.version }}
        run: |
          gh release create "v$VERSION" "${{ steps.dmg.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "InSitu $VERSION" \
            --notes-file docs/installer.md
