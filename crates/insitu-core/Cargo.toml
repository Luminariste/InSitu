[package]
name = "insitu-core"
description = "Moteur de calcul d'InSitu : géométrie, mire, déformation, vectorisation, exports."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Lecture et écriture d'images, sans les formats inutiles ici.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }

[dev-dependencies]
sha2 = "0.10"
