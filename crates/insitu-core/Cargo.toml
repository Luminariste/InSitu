[package]
name = "insitu-core"
description = "Moteur de calcul d'InSitu : géométrie, mire, déformation, vectorisation, exports."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Lecture et écriture d'images, sans les formats inutiles ici.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
# Plans de façade (tâche 3.1, décision D-3.1-a) : rendu PDF, SVG et lecture
# DXF, en Rust pur, sans bibliothèque système.
hayro = "0.9"
resvg = "0.50"
dxf = "0.6"
# Photos HEIC des iPhone (tâche 2.5, décision D-2.5-a) : décodeur HEVC en
# Rust pur, sans bibliothèque système.
zune-heic = "0.5"
# Écriture de la photo redressée avec sa résolution inscrite (pHYs, tags
# TIFF), pour qu'elle s'ouvre à 280 mm ailleurs. Mêmes versions que celles
# qu'utilise déjà `image`.
png = "0.18"
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
# Export SVG (tâche 5.3, décision D-5.3-c) : découpe des dessins par les
# silhouettes (différence de polygones), en Rust pur.
i_overlay = "9.1"

[dev-dependencies]
sha2 = "0.10"
# Fabrique des PDF d'essai dans les tests.
pdf-writer = "0.15"
