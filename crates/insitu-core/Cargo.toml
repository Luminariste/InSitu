[package]
name = "insitu-core"
description = "Moteur de calcul d'InSitu : géométrie, mire, déformation, vectorisation, exports."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Lecture et écriture d'images, sans les formats inutiles ici.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
# Plans de façade (tâche 3.1, décision D-3.1-a) : rendu PDF, SVG et lecture
# DXF, en Rust pur, sans bibliothèque système.
hayro = "0.9"
resvg = "0.50"
dxf = "0.6"

[dev-dependencies]
sha2 = "0.10"
# Fabrique des PDF d'essai dans les tests.
pdf-writer = "0.15"
