[workspace]
resolver = "2"
members = ["crates/insitu-core", "crates/insitu-cli", "src-tauri"]
# `cargo test` à la racine ne compile que le moteur : la coque Tauri a besoin
# de bibliothèques système absentes des sessions cloud Linux.
default-members = ["crates/insitu-core", "crates/insitu-cli"]

[workspace.package]
version = "0.1.78"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` : un nombre écrit puis relu est exactement le même (D-1.4-g).
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"

# Le moteur et ses dépendances sont optimisés même en développement et en
# test : la détection de la mire sur une photo de 12 Mpx prend quelques
# secondes optimisée, plusieurs minutes sans (décision D-2.4-g).
[profile.dev.package.insitu-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
